<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>时光相册</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 密码门 -->
  <div id="password-gate" class="password-gate">
    <div class="password-box">
      <h1 class="band-logo">✦</h1>
      <h2>时光相册</h2>
      <p>输入密码查看回忆</p>
      <input type="password" id="password-input" placeholder="请输入密码" autocomplete="off">
      <button id="password-btn">进入</button>
      <p id="password-error" class="error-msg" style="display:none;">密码错误，请重试</p>
    </div>
  </div>

  <!-- 主内容 -->
  <div id="main-content" class="main-content" style="display:none;">
    <header class="header">
      <h1 id="band-name">时光相册</h1>
      <div class="header-actions">
        <button id="random-btn" class="action-btn">&#10024; 随机回忆</button>
      </div>
    </header>

    <!-- 往年今日 -->
    <section id="on-this-day" class="on-this-day" style="display:none;"></section>

    <!-- 学期相册 -->
    <div id="album-list" class="album-list"></div>

    <!-- 事件详情（点击学期后显示） -->
    <div id="event-detail" class="event-detail" style="display:none;">
      <button id="back-btn" class="back-btn">&#8592; 返回</button>
      <div id="event-content"></div>
    </div>

    <footer class="footer">
      <p>时光相册 · SCN One</p>
    </footer>
  </div>

  <!-- 灯箱 -->
  <div id="lightbox" class="lightbox" style="display:none;">
    <button class="lightbox-close" id="lightbox-close">&times;</button>
    <button class="lightbox-prev" id="lightbox-prev">&#10094;</button>
    <img id="lightbox-img" src="" alt="">
    <button class="lightbox-next" id="lightbox-next">&#10095;</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/twikoo@1.6.39/dist/twikoo.all.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
